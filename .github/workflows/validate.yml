name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
            echo "::warning::bun.lock is missing; install was not frozen. Commit bun.lock for reproducible installs."
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build:dist

      - name: Test
        run: bun run test

      - name: Dist is reproducible against the checkout
        run: git diff --exit-code dist

      - name: Installer tests
        run: sh scripts/test-install.sh
